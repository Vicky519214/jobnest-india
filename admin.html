<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | JobNest India</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🛠️ JobNest India Admin Panel</h1>
</header>

<section class="resume-form">

<h2>Add New Post</h2>

<form id="jobForm">

<select id="category" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
  <option value="job">Latest Job</option>
  <option value="admit-card" selected>Admit Card</option>
  <option value="result">Result</option>
</select>

<input type="text" id="title" placeholder="Job Title / Post Name" required>

<input type="text" id="company" placeholder="Company / Department" required>

<input type="text" id="location" placeholder="Location" required>

<input type="text" id="salary" placeholder="Salary / Exam Date Details" required>

<input type="url" id="applyLink" placeholder="Apply Link / Download Link" required>

<button type="submit" class="btn">
➕ Add Post
</button>

</form>

<div id="message" style="margin-top: 15px; font-weight: bold;"></div>

</section>

<footer>
<p>© 2026 JobNest India</p>
</footer>

<script type="module" src="admin.js"></script>

</body>
</html>
