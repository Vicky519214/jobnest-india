<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | JobNest India</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🛠️ JobNest India Admin Panel</h1>
</header>

<section class="resume-form">

<h2>Add New Job</h2>

<form id="jobForm">

<input type="text" id="title" placeholder="Job Title" required>

<input type="text" id="company" placeholder="Company / Department" required>

<input type="text" id="location" placeholder="Location" required>

<input type="text" id="salary" placeholder="Salary" required>

<input type="url" id="applyLink" placeholder="Apply Link" required>

<button type="submit" class="btn">
➕ Add Job
</button>

</form>

<div id="message"></div>

</section>

<footer>
<p>© 2026 JobNest India</p>
</footer>

<script type="module" src="admin.js"></script>

</body>
</html>
