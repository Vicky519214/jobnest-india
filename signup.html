<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - JobNest India</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>JobNest India</h1>
<nav>
<a href="index.html">Home</a>
<a href="jobs.html">Government Jobs</a>
<a href="private-jobs.html">Private Jobs</a>
<a href="results.html">Results</a>
<a href="login.html">Login</a>
</nav>
</header>

<section class="container">
<h2>Create Account</h2>

<form id="signupForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
required>

<input
type="text"
id="state"
placeholder="State"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</section>

<footer>
<p>© 2026 JobNest India</p>
</footer>

<script type="module" src="signup.js"></script>

</body>
</html>
