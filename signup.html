<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | JobIndia</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📝 JobIndia Sign Up</h1>

<nav>
<a href="index.html">Home</a>
<a href="jobs.html">Government Jobs</a>
<a href="private-jobs.html">Private Jobs</a>
<a href="results.html">Results</a>
<a href="admit-card.html">Admit Card</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="signup.html" class="active">Sign Up</a>
</nav>

</header>

<section class="page-title">
<h2>Create Your Account</h2>
<p>Join JobIndia and get the latest job updates.</p>
</section>

<section class="resume-form">

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<select required>
<option value="">Select State</option>
<option>West Bengal</option>
<option>Bihar</option>
<option>Delhi</option>
<option>Maharashtra</option>
<option>Uttar Pradesh</option>
<option>Assam</option>
<option>Odisha</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>
<option>Other</option>
</select>

<label>
<input type="checkbox" required>
I agree to the Terms & Conditions
</label>

<button type="submit" class="btn">
Create Account
</button>

<p style="text-align:center; margin-top:15px;">
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</section>

<footer>
<p>© 2026 JobIndia | All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
